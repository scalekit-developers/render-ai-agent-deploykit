services:
  - type: web
    name: render-pr-summarizer
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node dist/main.js
    envVars:
      - key: PORT
        value: 3000

      # LLM — set these three vars for your chosen provider.
      #
      # OpenAI direct:
      #   OPENAI_API_KEY  = your OpenAI project key (sk-proj-...)
      #   OPENAI_BASE_URL = (leave blank — delete the env var or set it to empty)
      #   OPENAI_MODEL    = gpt-5-mini  (or gpt-5.6-terra / gpt-5.6-sol)
      #
      # LiteLLM proxy (or Azure OpenAI, Ollama, etc.):
      #   OPENAI_API_KEY  = your LiteLLM virtual key
      #   OPENAI_BASE_URL = https://your-litellm-proxy.example.com/v1
      #   OPENAI_MODEL    = claude-haiku-4-5  (or any id from GET /v1/models)
      #
      # Never set both an OpenAI key and a proxy URL at the same time —
      # the key must match the endpoint it is sent to.
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        sync: false
      - key: OPENAI_MODEL
        value: gpt-5-mini

      - key: SCALEKIT_ENVIRONMENT_URL
        sync: false
      - key: SCALEKIT_CLIENT_ID
        sync: false
      - key: SCALEKIT_CLIENT_SECRET
        sync: false
      # Defaults to the Render/Apify Demo GitHub connector on sampleapps.
      # Override in the dashboard for other Scalekit environments.
      - key: GITHUB_CONNECTION_NAME
        value: github-qkHFhMip
      - key: SESSION_SECRET
        generateValue: true
      # Optional — only needed if Render's proxy headers are unreliable.
      # The app infers its public URL from x-forwarded-proto and host
      # headers automatically, so you can leave this unset on first deploy
      # and the OAuth callback will still work.
      - key: PUBLIC_BASE_URL
        sync: false
